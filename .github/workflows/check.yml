name: VPN Gate Node Check

on:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    # Enable after both Workers and the DOMAIN secret are ready.
    if: vars.DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check deployment configuration
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "$CHECK_WORKER" ]; then
            echo '::error::Missing repository secret DOMAIN'
            exit 1
          fi

      - name: Check VPN Gate nodes and build page
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: '16'
          CHECK_TIMEOUT: '90'
          NODES_URL: https://chengsaijie.github.io/gate/nodes.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Site: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Nodes: ${PAGE_URL}nodes.txt" >> "$GITHUB_STEP_SUMMARY"
