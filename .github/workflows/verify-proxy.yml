name: Verify deployed proxy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public login page
        env:
          EDGE_ENTRY: ${{ vars.EDGE_ENTRY }}
        run: |
          hostname="${EDGE_ENTRY%:443}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "https://${hostname}/login" -o /tmp/gate-login.html
          test -s /tmp/gate-login.html
          echo 'Proxy login page is reachable from the GitHub runner.'
